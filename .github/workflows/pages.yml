name: Deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout Kvist documentation
        uses: actions/checkout@v7
        with:
          repository: kvist-lang/kvist
          ref: main
          path: _content/kvist

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install documentation builder
        run: npm ci

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp CNAME docs.css index.html kvist.png robots.txt style.css _site/
          node scripts/build-docs.mjs \
            --source _content/kvist/docs \
            --output _site \
            --config docs.config.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
